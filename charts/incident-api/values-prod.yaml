replicaCount: 3

image:
  repository: incident-platform-api
  tag: "0.5.0"
  pullPolicy: IfNotPresent

config:
  appEnv: production
  logLevel: warning

ingress:
  enabled: true
  className: nginx
  host: api.example.com

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi
