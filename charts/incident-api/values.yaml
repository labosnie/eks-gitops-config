replicaCount: 2

image:
  repository: incident-platform-api
  tag: "0.5.0"
  pullPolicy: IfNotPresent

config:
  appName: incident-platform-api
  appEnv: local
  logLevel: info

database:
  secretName: postgresql-credentials
  secretKey: DATABASE_URL

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: true
  className: nginx
  host: api.localhost

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  startup:
    path: /health
    failureThreshold: 30
    periodSeconds: 2

  readiness:
    path: /ready
    periodSeconds: 5

  liveness:
    path: /health
    periodSeconds: 10

migration:
  enabled: true
  command:
    - python
    - -m
    - alembic
    - upgrade
    - head
