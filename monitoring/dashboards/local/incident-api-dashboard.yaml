apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-incident-api
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: incident-api
    app.kubernetes.io/part-of: incident-platform

data:
  incident-api.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "graphTooltip": 1,
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (path) (rate(incident_api_http_requests_total[5m]))",
              "legendFormat": "{{path}}",
              "refId": "A"
            }
          ],
          "title": "Incident API - Requests/sec",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "id": 2,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(rate(incident_api_http_requests_total{status=~\"5..\"}[5m])) or vector(0)",
              "refId": "A"
            }
          ],
          "title": "Incident API - HTTP 5xx",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "id": 3,
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "histogram_quantile(0.95, sum by (le, path) (rate(incident_api_http_request_duration_seconds_bucket[5m])))",
              "legendFormat": "{{path}}",
              "refId": "A"
            }
          ],
          "title": "Incident API - Latency p95",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "id": 4,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "kube_deployment_status_replicas_available{namespace=\"incident-platform\",deployment=\"incident-api\"}",
              "refId": "A"
            }
          ],
          "title": "Incident API - Pods disponibles",
          "type": "stat"
        }
      ],
      "refresh": "15s",
      "schemaVersion": 39,
      "tags": [
        "incident-api",
        "gitops",
        "kubernetes"
      ],
      "templating": {
        "list": [
          {
            "current": {},
            "hide": 2,
            "name": "datasource",
            "query": "prometheus",
            "type": "datasource"
          }
        ]
      },
      "time": {
        "from": "now-15m",
        "to": "now"
      },
      "timezone": "browser",
      "title": "Incident API",
      "uid": "incident-api",
      "version": 1
    }
