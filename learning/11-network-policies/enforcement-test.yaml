apiVersion: v1
kind: Pod
metadata:
  name: network-policy-target
  namespace: incident-platform
  labels:
    app.kubernetes.io/name: network-policy-target
spec:
  containers:
    - name: web
      image: busybox:1.36.1
      command:
        - sh
        - -c
        - |
          echo "NetworkPolicy fonctionne" > /tmp/index.html
          httpd -f -p 8080 -h /tmp
      ports:
        - name: http
          containerPort: 8080
      resources:
        requests:
          cpu: 5m
          memory: 8Mi
        limits:
          cpu: 50m
          memory: 32Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: network-policy-target
  namespace: incident-platform
spec:
  selector:
    app.kubernetes.io/name: network-policy-target
  ports:
    - name: http
      port: 80
      targetPort: http
