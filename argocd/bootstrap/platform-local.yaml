apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-local
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/labosnie/eks-gitops-config.git
    targetRevision: main
    path: argocd/applications

    directory:
      recurse: false

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: true

    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
