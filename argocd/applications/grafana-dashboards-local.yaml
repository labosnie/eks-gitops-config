apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-dashboards-local
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/labosnie/eks-gitops-config.git
    targetRevision: main
    path: monitoring/dashboards/local

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true

    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
