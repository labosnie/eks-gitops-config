apiVersion: batch/v1
kind: Job
metadata:
  name: incident-api-migrate-0-5-0
  namespace: incident-platform
  labels:
    app.kubernetes.io/name: incident-api-migration
    app.kubernetes.io/part-of: incident-platform
    app.kubernetes.io/version: "0.5.0"
    environment: local

spec:
  backoffLimit: 2
  activeDeadlineSeconds: 120

  template:
    metadata:
      labels:
        app.kubernetes.io/name: incident-api-migration
        app.kubernetes.io/part-of: incident-platform

    spec:
      restartPolicy: Never

      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: alembic
          image: incident-platform-api:0.5.0
          imagePullPolicy: IfNotPresent

          command:
            - python
            - -m
            - alembic
            - upgrade
            - head

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgresql-credentials
                  key: DATABASE_URL

          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
