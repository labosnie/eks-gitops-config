apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: incident-platform
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/part-of: incident-platform
    environment: local
spec:
  clusterIP: None

  selector:
    app.kubernetes.io/name: postgresql

  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
      protocol: TCP
